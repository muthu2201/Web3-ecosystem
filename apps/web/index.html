    <!--
      A strict CSP is the main defence against the attack that took $1.46B from Bybit in
      February 2025: injected JavaScript in a served front-end, with no contract exploited at all.

      'wasm-unsafe-eval' is required by some wallet SDKs; connect-src is restricted to the
      platform's own edge proxy plus the RPC endpoints in the chain registry, so an injected
      script has nowhere to exfiltrate to even if it executes.

      frame-ancestors is absent here on purpose: browsers ignore it when it arrives in a meta
      element, and warn about it. It is delivered as an X-Frame-Options header instead — see
      vercel.json, which also re-sends this whole policy as a real CSP header.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://fonts.reown.com; connect-src 'self' https://*.workers.dev https://mainnet.base.org https://sepolia.base.org https://bsc-dataseed.bnbchain.org https://data-seed-prebsc-1-s1.bnbchain.org:8545 https://api.web3modal.org https://explorer-api.walletconnect.com https://pulse.walletconnect.org https://rpc.walletconnect.org wss://relay.walletconnect.org wss://relay.walletconnect.com; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'"
    />
    <meta name="referrer" content="no-referrer" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
