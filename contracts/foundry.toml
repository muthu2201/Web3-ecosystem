[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 800
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read-write", path = "./artifacts" }]
gas_reports = ["*"]
auto_detect_solc = false
deny = "warnings"

[lint]
exclude_lints = ["screaming-snake-case-immutable", "asm-keccak256"]

[profile.default.fuzz]
runs = 512
max_test_rejects = 200000

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false
call_override = false
shrink_run_limit = 2000

[profile.ci]
optimizer_runs = 800
verbosity = 3

[profile.ci.fuzz]
runs = 4096
max_test_rejects = 500000

[profile.ci.invariant]
runs = 512
depth = 128

[profile.deep.fuzz]
runs = 50000

[profile.deep.invariant]
runs = 2000
depth = 256

[fmt]
line_length = 118
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true

[rpc_endpoints]
base = "${BASE_RPC_URL}"
bsc = "${BSC_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

[etherscan]
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453, url = "https://api.etherscan.io/v2/api" }
bsc = { key = "${ETHERSCAN_API_KEY}", chain = 56, url = "https://api.etherscan.io/v2/api" }
